<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#121214"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WordTrio">
<title>WordTrio – daily word puzzles</title>
<style>
:root{--bg:#121214;--fg:#f2f2f2;--tile:#2b2b30;--c:#538d4e;--p:#b59f3b;--a:#3a3a3c;--y:#f9df6d;--g:#a0c35a;--b:#b0c4ef;--pu:#ba81c5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
header{width:100%;max-width:480px;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #333}
h1{font-size:20px;margin:0}
nav{display:flex;gap:6px;padding:8px}
nav button,.btn{background:var(--tile);color:var(--fg);border:0;border-radius:8px;padding:10px 14px;font-weight:600;cursor:pointer}
nav button.on{background:#4a6fa5}
main{width:100%;max-width:480px;padding:10px 14px}
#msg{min-height:24px;text-align:center;font-weight:600;margin:4px 0}
.row{display:flex;gap:5px;justify-content:center;margin-bottom:5px}
.cell{width:56px;height:56px;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;text-transform:uppercase}
.cell.correct{background:var(--c);border-color:var(--c)}.cell.present{background:var(--p);border-color:var(--p)}.cell.absent{background:var(--a);border-color:var(--a)}
.kb{margin-top:14px}.kb .row{gap:4px}
.key{flex:1;max-width:42px;height:52px;border:0;border-radius:6px;background:#818384;color:#fff;font-weight:700;text-transform:uppercase;cursor:pointer}
.key.wide{max-width:64px;font-size:12px}.key.correct{background:var(--c)}.key.present{background:var(--p)}.key.absent{background:var(--a)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:#3b3b42;border:0;color:var(--fg);border-radius:8px;min-height:64px;font-weight:700;font-size:clamp(10px,3.4vw,15px);padding:4px;word-break:break-word;cursor:pointer}
.tile.sel{background:#6d6d78;outline:2px solid #fff}
.solved{border-radius:8px;padding:10px;text-align:center;margin-bottom:6px;color:#111;font-weight:700}
.solved small{display:block;font-weight:500}
.g0{background:var(--y)}.g1{background:var(--g)}.g2{background:var(--b)}.g3{background:var(--pu)}
.dots{text-align:center;margin:8px 0;letter-spacing:4px}
.actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
svg{width:100%;max-width:340px;display:block;margin:0 auto}
svg .n rect{fill:#3b3b42;stroke:#666;stroke-width:2;rx:8}
svg .n.sel rect{stroke:#fff;fill:#6d6d78}svg .n.ok rect{stroke:var(--c)}
svg .n text{fill:#fff;font:700 11.5px system-ui;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
svg line{stroke:#777;stroke-width:3}svg line.good{stroke:var(--c)}svg line.bad{stroke:#c0392b}svg line.mark{stroke:#e67e22;stroke-width:5}svg line.mark.bad{stroke-dasharray:7 5}svg line.hit{stroke:transparent;stroke-width:22;cursor:pointer}svg{touch-action:none;user-select:none}svg .n{cursor:grab}svg .n.grp rect{stroke:#e67e22}svg .n.drag{opacity:.85}svg .n.drag rect{stroke:#fff}
.circuit-wrap{max-width:460px;margin:8px auto 0;padding:0 8px}.circuit{width:100%;height:auto;display:block}.cnode circle{fill:#303038;stroke:#777;stroke-width:2}.cnode.good circle{fill:#2f7d42;stroke:#69c27a;stroke-width:3}.cnode.bad circle{fill:#303038;stroke:#777;stroke-width:2}.cnode.selected circle{stroke:#fff;stroke-width:5}.cnode text{fill:#fff !important;font:700 13px system-ui;text-anchor:middle;dominant-baseline:middle}.cwire{stroke:#555;stroke-width:4}.cwire.good{stroke:#55b96b;stroke-width:6}.cwire.bad{stroke:#555}.waffle{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:360px;margin:auto}.mini h4{text-align:center;margin:4px}.mini .row{margin-bottom:3px}.mini .cell{width:30px;height:30px;font-size:15px}.mini button{width:100%;margin-top:5px}.waffle-key{margin-top:12px}.waffle-key>.row{display:block}.waffle-key>.row>.row{display:flex;gap:4px;margin-bottom:4px}.waffle-key .key{max-width:none;height:45px}
.clist{display:flex;flex-direction:column;gap:4px;max-width:360px;margin:10px auto}
.ctile{display:flex;align-items:center;gap:10px;min-height:36px;background:#303038;color:#fff;border:2px solid #5c5c65;border-radius:10px;padding:3px 12px;font:700 17px system-ui;letter-spacing:1px;cursor:grab;touch-action:none;user-select:none;position:relative}
.ctile .grip{color:#8a8a96;font-size:18px;letter-spacing:0}.ctile b{width:20px;color:#9a9aa5;font-size:13px}.ctile .w{flex:1}.ctile small{color:#bdbdc5;font-size:12px;font-weight:500;letter-spacing:0}
.ctile.selected{border-color:#fff;box-shadow:0 0 0 2px #fff5}.ctile.good{background:#2f7d42;border-color:#69c27a}.ctile.wrong{background:#4a3236;border-color:#a35c63}
.ctile.lifted{opacity:.35}.ctile.over{border-color:#7fb0e8;box-shadow:0 0 0 3px #7fb0e866}
.ctile.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.95;margin:0;box-shadow:0 8px 18px #000a;transform:scale(1.03)}
.help{max-width:400px;margin:10px auto;text-align:center;color:#d4d4da;line-height:1.4}
#msg.fatal{color:#ff8d8d;padding:8px;border:1px solid #a35c63;border-radius:8px}
dialog{background:#222;color:#fff;border:1px solid #555;border-radius:12px;max-width:340px}
pre{white-space:pre-wrap}
</style></head><body>
<header><h1>WordTrio</h1><button class="btn" id="statsBtn">Stats</button></header>
<nav><button data-g="wordle" class="on">Word</button><button data-g="conn">Groups</button><button data-g="pyra">Pyramid</button><button data-g="circuit">Circuit</button></nav>
<main><div id="msg"></div><div id="game"></div></main>
<dialog id="dlg"><div id="dlgBody"></div><div class="actions"><button class="btn" id="share">Share</button><button class="btn" id="close">Close</button></div></dialog>
<script>
// If anything stops the game from starting, say so on screen instead of leaving a blank page.
(function () {
  const show = text => { const m = document.getElementById('msg'); if (m) { m.className = 'fatal'; m.textContent = text; } };
  window.addEventListener('error', e => {
    if (window.__wtHandled) return;
    show('WordTrio could not start: ' + (e.message || 'unknown error') + '. Make sure index.html, core.js and data.js are all uploaded from the same version, then hard-refresh.');
  });
  window.__wtShow = text => { window.__wtHandled = true; show(text); };
})();
</script>
<script src="core.js?v=wt-9"></script><script src="data.js?v=wt-9"></script>
<script>
if (typeof Core === 'undefined' || Core.VERSION !== 'wt-9' || typeof Data === 'undefined' || !Data.PYRA || !Data.CIRCUIT || !Data.VALID) {
  window.__wtShow('WordTrio files do not match: core.js is ' + (typeof Core === 'undefined' ? 'missing' : 'version ' + Core.VERSION) + ' but index.html needs wt-9. Upload index.html, core.js and data.js together, then hard-refresh.');
  throw new Error('version mismatch');
}
const $ = s => document.querySelector(s);
// Wordle accepts only real words: the built-in list first, then (once, cached) an online dictionary for anything else.
const KNOWN = new Set([...Data.LIST, ...Data.VALID]);
const DICT_URL = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
let checking = false;
async function realWord(w) {
  if (Core.isKnownWord(w, KNOWN)) return true;
  const cache = store.get('dict', {});
  if (w in cache) return cache[w];
  try {
    const r = await fetch(DICT_URL + w);
    if (r.status === 200) { cache[w] = true; store.set('dict', cache); return true; }
    if (r.status === 404) { cache[w] = false; store.set('dict', cache); return false; }
  } catch (e) {}
  return null;   // could not check (offline)
}
const today = Core.dateKey(), idx = Core.dayIndex();
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('wt:' + k)) ?? d; } catch (e) { return d; } }, set(k, v) { localStorage.setItem('wt:' + k, JSON.stringify(v)); } };
const ANSWERS = Core.shuffle(Data.LIST, 20260101);
const answer = Core.pick(ANSWERS, idx);
const connP = Core.pick(Data.CONNECTIONS, idx), pyraP = Core.pick(Data.PYRA, idx);
let current = 'wordle', shareText = '';
const say = t => { $('#msg').textContent = t; if (t) setTimeout(() => { if ($('#msg').textContent === t) $('#msg').textContent = ''; }, 2200); };
function day(game, init) { const s = store.get(game, null); return s && s.date === today ? s : Object.assign({ date: today }, init); }
function finish(game, st, won) {
  store.set(game + ':stats', Core.updateStats(store.get(game + ':stats', null), won, today));
  setTimeout(() => showStats(game, st), 900);
}

// ---------- Wordle ----------
let W;
function renderWordle() {
  W = day('wordle', { guesses: [], cur: '', over: false, won: false });
  let h = '';
  for (let r = 0; r < 6; r++) {
    h += '<div class="row">';
    const g = W.guesses[r], ev = g && Core.wordleEval(g, answer);
    for (let c = 0; c < 5; c++) {
      const ch = g ? g[c] : (r === W.guesses.length ? (W.cur[c] || '') : '');
      h += `<div class="cell ${ev ? ev[c] : ''}">${ch}</div>`;
    }
    h += '</div>';
  }
  const ks = Core.keyboardState(W.guesses, answer);
  const rows = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'];
  h += '<div class="kb">' + rows.map(r => '<div class="row">' + [...r].map(k => k === '+' ? '<button class="key wide" data-k="Enter">Enter</button>' : k === '-' ? '<button class="key wide" data-k="Backspace">Del</button>' : `<button class="key ${ks[k] || ''}" data-k="${k}">${k}</button>`).join('') + '</div>').join('') + '</div>';
  $('#game').innerHTML = h;
  document.querySelectorAll('.key').forEach(b => b.onclick = () => wkey(b.dataset.k));
}
async function submitGuess() {
  if (checking || W.over) return;
  const g = W.cur;
  if (g.length < 5) return say('Not enough letters');
  let ok = Core.isKnownWord(g, KNOWN);
  if (!ok) { checking = true; say('Checking…'); ok = await realWord(g); checking = false; }
  if (current !== 'wordle' || W.over || W.cur !== g) return;
  if (ok === false) return say('Not a real word');
  if (ok === null) return say('Not in my list, and I cannot check it offline');
  say('');
  W.guesses.push(W.cur); W.cur = '';
  if (W.guesses[W.guesses.length - 1] === answer) { W.over = W.won = true; say('Brilliant'); }
  else if (W.guesses.length === 6) { W.over = true; say(answer.toUpperCase()); }
  store.set('wordle', W); renderWordle();
  if (W.over) finish('wordle', W, W.won);
}
function wkey(k) {
  if (current !== 'wordle' || W.over || checking) return;
  if (k === 'Enter') {
    submitGuess();
    return;
  } else if (k === 'Backspace') W.cur = W.cur.slice(0, -1);
  else if (/^[a-z]$/i.test(k) && W.cur.length < 5) W.cur += k.toLowerCase();
  store.set('wordle', W); renderWordle();
}
document.addEventListener('keydown', e => { if (!e.ctrlKey && !e.metaKey && current === 'wordle') wkey(e.key); });

// ---------- Connections ----------
let K;
function renderConn() {
  K = day('conn', { board: Core.connectionsBoard(connP, idx), sel: [], solved: [], mistakes: 0, history: [], over: false, won: false });
  let h = K.solved.map(g => `<div class="solved g${g}">${connP.groups[g].name}<small>${connP.groups[g].words.join(', ')}</small></div>`).join('');
  const left = K.board.filter(w => !K.solved.some(g => connP.groups[g].words.includes(w)));
  h += '<div class="grid">' + left.map(w => `<button class="tile ${K.sel.includes(w) ? 'sel' : ''}" data-w="${w}">${w}</button>`).join('') + '</div>';
  h += `<div class="dots">Mistakes left: ${'● '.repeat(4 - K.mistakes)}${'○ '.repeat(K.mistakes)}</div>`;
  if (!K.over) h += '<div class="actions"><button class="btn" id="cs">Shuffle</button><button class="btn" id="cd">Deselect</button><button class="btn" id="cu">Submit</button></div>';
  $('#game').innerHTML = h;
  document.querySelectorAll('.tile').forEach(b => b.onclick = () => {
    if (K.over) return; const w = b.dataset.w;
    K.sel = K.sel.includes(w) ? K.sel.filter(x => x !== w) : (K.sel.length < 4 ? [...K.sel, w] : K.sel);
    store.set('conn', K); renderConn();
  });
  if (!K.over) {
    $('#cs').onclick = () => { K.board = Core.shuffle(K.board, Date.now() & 0xffff); store.set('conn', K); renderConn(); };
    $('#cd').onclick = () => { K.sel = []; store.set('conn', K); renderConn(); };
    $('#cu').onclick = () => {
      if (K.sel.length !== 4) return say('Pick four words');
      if (K.history.some(h => h.slice().sort().join() === K.sel.slice().sort().join())) return say('Already guessed');
      const r = Core.connectionsCheck(K.sel, connP); K.history.push(K.sel.slice());
      if (r.result === 'correct') { K.solved.push(r.group); }
      else { K.mistakes++; say(r.result === 'one-away' ? 'One away…' : 'Not a group'); }
      K.sel = [];
      if (K.solved.length === 4) K.over = K.won = true;
      else if (K.mistakes >= 4) { K.over = true; connP.groups.forEach((g, i) => { if (!K.solved.includes(i)) K.solved.push(i); }); }
      store.set('conn', K); renderConn();
      if (K.over) finish('conn', K, K.won);
    };
  }
}

// ---------- Pyramid ----------
// 15 words in a full binary tree, four layers deep: 1 + 2 + 4 + 8. The bottom layer is drawn in two staggered rows so
// each word gets a wide, readable box on a phone.
const PW = 340, PH = 232, NODE_W = 70, NODE_H = 28;
const POS = (() => {
  const pos = Array(Core.PYRA_N);
  for (let i = 0; i < 8; i++) pos[7 + i] = [35 + 38.571 * i, i % 2 === 0 ? 178 : 214];
  for (let j = 0; j < 4; j++) pos[3 + j] = [(pos[7 + 2 * j][0] + pos[8 + 2 * j][0]) / 2, 124];
  pos[1] = [(pos[3][0] + pos[4][0]) / 2, 72]; pos[2] = [(pos[5][0] + pos[6][0]) / 2, 72];
  pos[0] = [170, 22];
  return pos;
})();
let P;
const samePyraWords = a => Array.isArray(a) && a.length === Core.PYRA_N && a.slice().sort().join() === pyraP.nodes.slice().sort().join();
function pyraSave() { store.set('pyra', P); renderPyra(); }
// A move that would break a marked (orange) link is refused: the words snap back and a message says why.
function applyMove(from, to) {
  const r = Core.pyraMove(P.arr, P.marks, from, to);
  if (r.error) say(r.error);
  if (r.moved) P.arr = r.arr;
  P.sel = null; pyraSave();
}
function tapNode(i) {
  if (P.sel === null) P.sel = i; else if (P.sel === i) P.sel = null; else return applyMove(P.sel, i);
  pyraSave();
}
function setupPyraInput(svg) {
  let drag = null;
  const rect = () => svg.getBoundingClientRect();
  const nodeAt = (x, y, skip) => {
    let best = -1, bd = 1e9;
    POS.forEach(([px, py], i) => { if (skip.includes(i)) return; const d = Math.hypot(px - x, py - y); if (d < bd) { bd = d; best = i; } });
    return bd < 40 ? best : -1;
  };
  svg.addEventListener('pointerdown', e => {
    const n = e.target.closest('.n'); if (!n) return;
    const i = +n.dataset.i;
    drag = { i, group: Core.groupOf(P.arr, P.marks, i), sx: e.clientX, sy: e.clientY, moved: false };
    svg.setPointerCapture(e.pointerId); e.preventDefault();
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return;
    drag.moved = true;
    const k = PW / rect().width;
    drag.group.forEach(g => {
      const el = svg.querySelector(`.n[data-i="${g}"]`);
      el.setAttribute('transform', `translate(${dx * k},${dy * k})`); el.classList.add('drag');
    });
  });
  svg.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved) return tapNode(d.i);
    const r = rect(), t = nodeAt((e.clientX - r.left) * PW / r.width, (e.clientY - r.top) * PH / r.height, [d.i]);
    if (t < 0) return renderPyra();
    applyMove(d.i, t);
  });
  svg.addEventListener('pointercancel', () => { drag = null; renderPyra(); });
}
function renderPyra() {
  const fresh = () => ({ date: today, arr: Core.pyraScramble(pyraP, idx), sel: null, marks: [], history: [], tried: [], known: { green: [], red: [] }, over: false, won: false });
  P = day('pyra', fresh());
  // A saved game from an older build (7 words, or different words) is discarded.
  if (!samePyraWords(P.arr)) { P = fresh(); store.set('pyra', P); }
  P.known = P.known || { green: [], red: [] }; P.tried = P.tried || []; P.history = P.history || [];
  P.marks = (P.marks || []).filter(m => typeof m === 'string');
  // Once the game is over, orange marks and selections are gone for good.
  if (P.over && (P.marks.length || P.sel !== null)) { P.marks = []; P.sel = null; store.set('pyra', P); }
  const none = Core.EDGES.map(() => '');
  const st = P.over ? (P.won ? Core.EDGES.map(() => 'good') : none) : Core.pyraStatus(P.arr, P.known);
  const me = P.over ? Core.EDGES.map(() => false) : Core.markedEdges(P.arr, P.marks);
  const selGroup = P.sel === null ? [] : Core.groupOf(P.arr, P.marks, P.sel);
  let s = `<svg viewBox="0 0 ${PW} ${PH}" id="pyraSvg">`;
  Core.EDGES.forEach(([a, b], i) => {
    const cls = st[i] === 'good' ? 'good' : me[i] ? 'mark ' + st[i] : st[i];
    const c = `x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}"`;
    s += `<line class="${cls}" ${c}/>`;
    if (!P.over) s += `<line class="hit" data-e="${i}" ${c}/>`;
  });
  P.arr.forEach((w, i) => {
    const ok = Core.EDGES.every(([a, b], e) => (a !== i && b !== i) || st[e] === 'good');
    const grp = Core.groupOf(P.arr, P.marks, i).length > 1;
    s += `<g class="n ${selGroup.includes(i) ? 'sel' : ''} ${ok ? 'ok' : ''} ${grp ? 'grp' : ''}" data-i="${i}"><rect x="${POS[i][0] - NODE_W / 2}" y="${POS[i][1] - NODE_H / 2}" width="${NODE_W}" height="${NODE_H}"/><text x="${POS[i][0]}" y="${POS[i][1]}">${w}</text></g>`;
  });
  s += '</svg>';
  if (P.over) {
    const n = pyraP.nodes;
    s += '<p class="help">' + Core.EDGES.map(([a, b]) => n[a] + n[b]).join(' · ') + '</p>';
  } else {
    s += '<p class="help">Fifteen words make a pyramid four layers deep. Read each line downward: the upper word plus the lower word makes one word, like FIRE + WORK = FIREWORK. Drag a word onto another to swap, or tap one then the other. Tap a line to mark it orange. Marked words move together as a group, and a marked link is never broken: a move that would break one is refused. Green links stay green while those two words stay together.</p>';
  }
  const G = Core.PYRA_GUESSES;
  s += `<div class="dots">Guesses left: ${'● '.repeat(G - P.history.length)}${'○ '.repeat(P.history.length)}</div>`;
  if (!P.over) s += '<div class="actions"><button class="btn" id="pg">Submit guess</button></div>';
  $('#game').innerHTML = s;
  if (P.over) return;
  const svg = $('#game').querySelector('svg');
  if (svg) setupPyraInput(svg);
  document.querySelectorAll('svg line.hit').forEach(l => l.onclick = () => {
    const [a, b] = Core.EDGES[+l.dataset.e], key = Core.pairKey(P.arr[a], P.arr[b]);
    P.marks = P.marks.includes(key) ? P.marks.filter(x => x !== key) : [...P.marks, key];
    pyraSave();
  });
  $('#pg').onclick = () => {
    const key = P.arr.join();
    if (P.tried.includes(key)) return say('Already guessed');
    const res = Core.pyraLinks(P.arr, pyraP);
    P.tried.push(key); P.history.push(res); P.known = Core.pyraRecord(P.arr, pyraP, P.known);
    if (res.every(Boolean)) { P.over = P.won = true; P.marks = []; P.sel = null; say('Solved'); }
    else if (P.history.length >= G) { P.over = true; P.marks = []; P.sel = null; P.arr = pyraP.nodes.slice(); say('Out of guesses'); }
    else say(res.filter(Boolean).length + ' of ' + res.length + ' links correct');
    pyraSave();
    if (P.over) finish('pyra', P, P.won);
  };
}

// ---------- Circuit ----------
// A numbered list of 12 words. Drag a word onto another to swap them (tapping one then another also works).
// Nothing is coloured until Check loop is pressed.
let CIRC;
function renderCircuit() {
  const p = Core.pick(Data.CIRCUIT, idx), MAXC = Core.CIRCUIT_CHECKS;
  const fresh = () => ({ date: today, puzzle: p.id, arr: Core.circuitBoard(p, idx), guesses: 0, feedback: null, over: false, won: false });
  CIRC = day('circuit', fresh());
  // A saved game for a different puzzle (older builds had different loops) is discarded.
  if (CIRC.puzzle !== p.id || !Array.isArray(CIRC.arr) || CIRC.arr.slice().sort().join() !== p.words.slice().sort().join()) { CIRC = fresh(); store.set('circuit', CIRC); }
  if (!Array.isArray(CIRC.feedback)) CIRC.feedback = null;
  const n = CIRC.arr.length, fb = CIRC.feedback;
  let h = '<p class="help"><b>How to play:</b> drag a word onto another to swap them. Each word must end with the two letters that start the next word, and the last word must link back to the first. Several words can look right, but only a full loop works. Press Check loop to see which links work.</p>';
  h += '<div class="clist" id="clist">' + CIRC.arr.map((w, i) => {
    const state = fb ? (fb[i] ? 'good' : 'wrong') : '';
    return `<div class="ctile ${state}" data-ci="${i}"><span class="grip">⠿</span><b>${i + 1}</b><span class="w">${w}</span><small>${fb ? (fb[i] ? '✓ ' : '✗ ') : ''}${i === n - 1 ? '↩ first' : '↓'}</small></div>`;
  }).join('') + '</div>';
  h += `<div class="dots">Checks used: ${CIRC.guesses}/${MAXC}</div>`;
  if (!CIRC.over) h += '<div class="actions"><button class="btn" id="cshuffle">Shuffle</button><button class="btn" id="ccheck">Check loop</button></div>';
  else h += '<p class="help">' + (CIRC.won ? 'Loop closed.' : 'Out of checks. One valid loop: ' + p.solution.join(' → ') + ' → ' + p.solution[0]) + '</p>';
  $('#game').innerHTML = h;
  if (CIRC.over) return;
  bindCircuitDrag($('#clist'));
  $('#cshuffle').onclick = () => { CIRC.arr = Core.shuffle(CIRC.arr, Date.now() & 65535); CIRC.feedback = null; store.set('circuit', CIRC); renderCircuit(); };
  $('#ccheck').onclick = () => {
    const r = Core.circuitCheck(CIRC.arr, p);
    CIRC.feedback = r.links; CIRC.guesses++;
    if (r.solved) { CIRC.over = CIRC.won = true; say('Loop closed'); }
    else if (CIRC.guesses >= MAXC) { CIRC.over = true; say('Out of checks'); }
    else say(r.correct + ' of ' + n + ' links correct');
    store.set('circuit', CIRC); renderCircuit();
    if (CIRC.over) finish('circuit', CIRC, CIRC.won);
  };
}
function swapCircuit(i, j) {
  CIRC.arr = Core.swap(CIRC.arr, i, j); CIRC.feedback = null;
  store.set('circuit', CIRC); renderCircuit();
}
function bindCircuitDrag(list) {
  let d = null, selected = null;
  const tileAt = (x, y, skip) => document.elementsFromPoint(x, y).find(el => el.classList && el.classList.contains('ctile') && el !== skip) || null;
  const cleanup = s => { if (s.ghost) s.ghost.remove(); if (s.over) s.over.classList.remove('over'); s.el.classList.remove('lifted'); };
  list.addEventListener('pointerdown', e => {
    const t = e.target.closest('.ctile'); if (!t) return;
    d = { i: +t.dataset.ci, el: t, x: e.clientX, y: e.clientY, active: false, ghost: null, over: null, ox: 0, oy: 0 };
    try { list.setPointerCapture(e.pointerId); } catch (err) {}
  });
  list.addEventListener('pointermove', e => {
    if (!d) return;
    if (!d.active) {
      if (Math.hypot(e.clientX - d.x, e.clientY - d.y) < 8) return;
      d.active = true;
      const r = d.el.getBoundingClientRect();
      d.ox = d.x - r.left; d.oy = d.y - r.top;
      const g = d.el.cloneNode(true);
      g.classList.add('ghost'); g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
      document.body.appendChild(g); d.ghost = g;
      d.el.classList.add('lifted');
      selected = null;
    }
    d.ghost.style.left = (e.clientX - d.ox) + 'px'; d.ghost.style.top = (e.clientY - d.oy) + 'px';
    const t = tileAt(e.clientX, e.clientY, d.el);
    if (d.over !== t) { if (d.over) d.over.classList.remove('over'); d.over = t; if (t) t.classList.add('over'); }
    if (e.clientY < 70) window.scrollBy(0, -14); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 14);
  });
  list.addEventListener('pointerup', e => {
    if (!d) return;
    const s = d; d = null;
    cleanup(s);
    if (s.active) { if (s.over) swapCircuit(s.i, +s.over.dataset.ci); return; }
    // a tap: select a word, then tap another to swap
    if (selected === null) { selected = s.i; s.el.classList.add('selected'); }
    else if (selected === s.i) { selected = null; s.el.classList.remove('selected'); }
    else { const from = selected; selected = null; swapCircuit(from, s.i); }
  });
  list.addEventListener('pointercancel', () => { if (d) { cleanup(d); d = null; } });
}

// ---------- Stats dialog ----------
function showStats(game, st) {
  const names = { wordle: 'Word', conn: 'Groups', pyra: 'Pyramid', circuit: 'Circuit' };
  const s = Object.assign({ played: 0, wins: 0, streak: 0, best: 0 }, store.get(game + ':stats', {}));
  $('#dlgBody').innerHTML = `<h3>${names[game]} stats</h3><p>Played ${s.played} · Won ${s.wins} · Streak ${s.streak} · Best ${s.best}</p>` + (st && st.over ? '<pre id="sh"></pre>' : '');
  shareText = '';
  if (st && st.over) {
    shareText = game === 'wordle' ? Core.shareWordle(st.guesses, answer, today, st.won)
      : game === 'conn' ? Core.shareConnections(st.history, connP, today)
      : game === 'pyra' ? Core.sharePyra(st.history, today, st.won)
      : 'WordTrio ' + names[game] + ' ' + today + (st.won ? ' solved' : ' X');
    shareText += '\nhttps://sillywongs.github.io/wordtrio/#' + game;
    $('#sh').textContent = shareText;
  }
  $('#share').style.display = shareText ? '' : 'none';
  $('#dlg').showModal();
}
$('#statsBtn').onclick = () => showStats(current, current === 'wordle' ? W : current === 'conn' ? K : current === 'pyra' ? P : CIRC);
$('#close').onclick = () => $('#dlg').close();
$('#share').onclick = async () => { try { navigator.share ? await navigator.share({ text: shareText }) : await navigator.clipboard.writeText(shareText); say('Shared'); } catch (e) {} };

function show(g) {
  current = g;
  history.replaceState(null, '', '#' + g);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.g === g));
  ({ wordle: renderWordle, conn: renderConn, pyra: renderPyra, circuit: renderCircuit })[g]();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.g));
const startTab = location.hash.slice(1);
show(['wordle', 'conn', 'pyra', 'circuit'].includes(startTab) ? startTab : 'wordle');
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script></body></html>
